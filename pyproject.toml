[project]
name = "rag_project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aman Babbar", email = "amanbabbar2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.150.1",
    "huggingface-hub[hf-xet]>=0.36.2",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.5.0",
    "langchain-google-genai>=4.5.0",
    "langchain-openai>=1.8.0",
    "nemoguardrails[jailbreak,sdd]>=0.23.0",
    "nest-asyncio>=1.6.0",
    "numpy<2",
    "ollama>=0.6.3",
    "onnxruntime<1.20.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=5.7.0",
    "torch<2.3.0",
    "transformers>=4.51.3",
]

[project.scripts]
rag_project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
